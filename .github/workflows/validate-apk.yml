name: 1 - Validar build do Habbo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: habbo-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar FFDec
        run: bash ci/setup-ffdec.sh

      - name: Recompilar SWF, executar testes e montar APK
        run: bash ci/build-apk.sh "$RUNNER_TEMP/Habbo-unsigned.apk"
