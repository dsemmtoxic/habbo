name: 2 - Gerar APK assinado

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: habbo-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar FFDec
        run: bash ci/setup-ffdec.sh

      - name: Recompilar SWF, executar testes e montar APK
        run: bash ci/build-apk.sh "$RUNNER_TEMP/Habbo-unsigned.apk"

      - name: Preparar Android Build Tools
        uses: android-actions/setup-android@v3
        with:
          packages: build-tools;36.0.0

      - name: Alinhar, assinar e verificar o APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >-
          bash ci/sign-apk.sh "$RUNNER_TEMP/Habbo-unsigned.apk"
          "output/Habbo_2.32.45_Teste80_Base33.apk"

      - name: Disponibilizar APK assinado
        uses: actions/upload-artifact@v4
        with:
          name: Habbo-APK-assinado-${{ github.run_number }}
          path: |
            output/Habbo_2.32.45_Teste80_Base33.apk
            output/Habbo_2.32.45_Teste80_Base33.apk.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
